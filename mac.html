<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAC – Pretty</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header>
    <div class="logo">
      <svg viewBox="0 0 40 40" width="40" height="40" fill="currentColor">
        <circle cx="20" cy="20" r="12" />
        <rect x="18" y="8" width="4" height="10" />
      </svg>
    </div>

    <h1 class="site-title">Pretty</h1>

    <nav id="main-nav">
      <ul class="nav-list">
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="../cart.html">Carrito</a></li>
      </ul>
      <a href="../cart.html" class="cart-icon" id="cart-link">
        🛒
        <span class="cart-count">0</span>
      </a>
    </nav>

    <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">
      ☰
    </button>
  </header>

  <main style="padding: 2rem;">
    <h2 class="section-title">MAC – Maquillaje profesional premium</h2>

    <div class="products-grid">
      <article class="product-card">
        <img src="https://via.placeholder.com/180/f5f0e6/6b4423?text=MAC+Foundation" alt="MAC Foundation" />
        <h3>Studio Fix Base</h3>
        <p>$32,500</p>
        <button class="add-to-cart">Agregar al carrito</button>
      </article>

      <article class="product-card">
        <img src="https://via.placeholder.com/180/f5f0e6/6b4423?text=MAC+Lipstick" alt="MAC Lipstick" />
        <h3>Retro Matte Lipstick</h3>
        <p>$28,900</p>
        <button class="add-to-cart">Agregar al carrito</button>
      </article>

      <article class="product-card">
        <img src="https://via.placeholder.com/180/f5f0e6/6b4423?text=MAC+Eyes" alt="MAC Eyeshadow" />
        <h3>Satin Eye Palette</h3>
        <p>$36,700</p>
        <button class="add-to-cart">Agregar al carrito</button>
      </article>
    </div>
  </main>

  <script src="../script.js"></script>
</body>
</html>
